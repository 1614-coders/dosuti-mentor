name: Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  linux:
    name: Linux / full unittest suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plugins/dosuti-mentor/scripts/requirements.txt
      - name: Install existing runtime dependencies
        run: |
          python -m pip install --only-binary=:all: -r plugins/dosuti-mentor/scripts/requirements.txt
      - name: Run full test suite
        run: python -B -m unittest discover -s plugins/dosuti-mentor/tests -v

  windows:
    name: Windows / runtime and onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plugins/dosuti-mentor/scripts/requirements.txt
      - name: Install existing runtime dependencies
        run: |
          python -m pip install --only-binary=:all: -r plugins/dosuti-mentor/scripts/requirements.txt
      - name: Run supported Windows checks
        working-directory: plugins/dosuti-mentor/tests
        run: |
          Get-Command tar, tar.exe | Format-Table CommandType, Name, Source
          python -B -m unittest -v test_windows_runtime test_windows_onboarding test_platform_diagnostics
      - name: Run Windows PowerShell 5.1 checks
        working-directory: plugins/dosuti-mentor/tests
        shell: powershell
        env:
          DOSUTI_TEST_PWSH: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        run: |
          Get-Command Get-FileHash | Format-Table Name, Source
          python -B -m unittest -v test_windows_runtime test_windows_onboarding test_platform_diagnostics
