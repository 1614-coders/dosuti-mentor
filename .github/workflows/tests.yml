name: Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  linux:
    name: Linux / full unittest suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plugins/dosuti-mentor/scripts/requirements.txt
      - name: Install existing runtime dependencies
        run: |
          python -m pip install --only-binary=:all: -r plugins/dosuti-mentor/scripts/requirements.txt
      - name: Run full test suite
        run: |
          python -c "import sys; assert sys.platform == 'linux', sys.platform"
          python -B -m unittest discover -s plugins/dosuti-mentor/tests -v

  windows:
    name: Windows / runtime and onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plugins/dosuti-mentor/scripts/requirements.txt
      - name: Install existing runtime dependencies
        run: |
          python -m pip install --only-binary=:all: -r plugins/dosuti-mentor/scripts/requirements.txt
      - name: Run supported Windows checks
        working-directory: plugins/dosuti-mentor/tests
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          $tempRoot = [System.IO.Path]::GetPathRoot([System.IO.Path]::GetTempPath())
          $format = ([System.IO.DriveInfo]::new($tempRoot)).DriveFormat
          Write-Host "Test temp filesystem: $format"
          if ($format -ne 'NTFS') { throw 'Windows regression tests require NTFS temp storage' }
          $env:DOSUTI_TEST_PWSH = (Get-Command pwsh -CommandType Application).Source
          Get-Command tar, tar.exe | Format-Table CommandType, Name, Source
          python -B -m unittest -v windows_test_suite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce first-install races on PowerShell 7
        if: ${{ !cancelled() }}
        working-directory: plugins/dosuti-mentor/tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DOSUTI_TEST_PWSH = (Get-Command pwsh -CommandType Application).Source
          python -B test_windows_install_race.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce first-install races on Windows PowerShell 5.1
        if: ${{ !cancelled() }}
        working-directory: plugins/dosuti-mentor/tests
        shell: powershell
        env:
          DOSUTI_TEST_PWSH: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:DOSUTI_TEST_PWSH)) { throw 'Windows PowerShell 5.1 unavailable' }
          python -B test_windows_install_race.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows PowerShell 5.1 checks
        if: ${{ !cancelled() }}
        working-directory: plugins/dosuti-mentor/tests
        shell: powershell
        env:
          DOSUTI_TEST_PWSH: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required' }
          Get-Command Get-FileHash | Format-Table Name, Source
          python -B -m unittest -v windows_test_suite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
